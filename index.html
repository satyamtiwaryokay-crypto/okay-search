<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okay Search</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: #202124;
  font-family: Arial, Helvetica, sans-serif;
  transition: .3s;
}

body.dark {
  background: #202124;
  color: #fff;
}

/* =========================
   OKAY LOGO
   Tesla-inspired clean style
========================= */

.logo {
  font-family: " Roboto ", Arial, sans-serif;
  font-size: 64px;
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1;
  margin-bottom: 30px;
  transform: scaleX(0.92);
}

.logo .o {
  color: #e53935;
  font-weight: 700;
}

.logo .k {
  color: #4285f4;
  font-weight: 600;
}

.logo .a {
  color: #fbbc05;
  font-weight: 600;
}

.logo .y {
  color: #34a853;
  font-weight: 600;
}

/* Small logo */

.small-logo {
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 38px;
  font-weight: 600;
  letter-spacing: -4px;
  transform: scaleX(.92);
}

.small-logo .o {
  color: #e53935;
}

.small-logo .k {
  color: #4285f4;
}

.small-logo .a {
  color: #fbbc05;
}

.small-logo .y {
  color: #34a853;
}

/* =========================
   HOME
========================= */

#homePage {
  min-height: 100vh;
  text-align: center;
  padding-top: 120px;
}

/* =========================
   SEARCH BOX
========================= */

.search-box {
  width: min(650px, 92%);
  height: 56px;
  margin: auto;
  border: 1px solid #dfe1e5;
  border-radius: 30px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  transition: .2s;
}

.search-box:hover {
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

.dark .search-box {
  background: #303134;
  border-color: #5f6368;
}

.search-box input {
  flex: 1;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: #202124;
  font-size: 17px;
  padding: 0 8px;
}

.dark .search-box input {
  color: white;
}

.icon-button {
  width: 42px;
  height: 42px;
  border: none;
  background: transparent;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-button:hover {
  background: #f1f3f4;
}

.dark .icon-button:hover {
  background: #3c4043;
}

.icon-button svg {
  width: 21px;
  height: 21px;
}

/* =========================
   SEARCH BUTTON
========================= */

.search-button {
  margin-top: 25px;
  padding: 11px 25px;
  border: none;
  border-radius: 6px;
  background: #202124;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.search-button:hover {
  background: #000;
}

/* =========================
   DARK MODE
========================= */

.top-buttons {
  position: absolute;
  top: 18px;
  right: 20px;
}

.top-buttons button {
  border: none;
  background: transparent;
  font-size: 23px;
  cursor: pointer;
}

/* =========================
   RESULTS PAGE
========================= */

#resultsPage {
  display: none;
  min-height: 100vh;
  padding: 25px;
}

.results-top {
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}

.result-search {
  flex: 1;
  max-width: 650px;
}

.result-search .search-box {
  width: 100%;
  margin: 0;
}

/* =========================
   TABS
========================= */

.tabs {
  max-width: 900px;
  margin: 25px auto 10px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.tabs button {
  border: none;
  background: #f1f3f4;
  padding: 9px 17px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
}

.dark .tabs button {
  background: #3c4043;
  color: white;
}

/* =========================
   RESULTS
========================= */

#results {
  max-width: 900px;
  margin: 20px auto;
}

.result-card {
  padding: 18px 5px;
  border-bottom: 1px solid #dadce0;
  text-align: left;
}

.dark .result-card {
  border-color: #5f6368;
}

.result-card a {
  font-size: 20px;
  color: #1a0dab;
  text-decoration: none;
}

.dark .result-card a {
  color: #8ab4f8;
}

.result-card a:hover {
  text-decoration: underline;
}

.result-url {
  color: #188038;
  font-size: 14px;
  margin: 5px 0;
}

.dark .result-url {
  color: #81c995;
}

.result-card p {
  margin: 5px 0;
  line-height: 1.5;
  color: #4d5156;
}

.dark .result-card p {
  color: #bdc1c6;
}

.result-image {
  width: 180px;
  max-height: 120px;
  object-fit: cover;
  border-radius: 8px;
  margin-top: 10px;
}

#loading {
  display: none;
  text-align: center;
  margin: 30px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #homePage {
    padding-top: 100px;
  }

  .logo {
    font-size: 55px;
  }

  .search-box {
    height: 53px;
  }

  .search-box input {
    font-size: 16px;
  }

  .small-logo {
    width: 100%;
  }

  .result-search {
    width: 100%;
  }
}
</style>
</head>

<body>

<!-- DARK MODE -->
<div class="top-buttons">
  <button onclick="toggleDarkMode()" title="Dark Mode">◐</button>
</div>


<!-- =========================
     HOME PAGE
========================= -->

<div id="homePage">

  <div class="logo">
    <span class="o">O</span><span class="k">k</span><span class="a">a</span><span class="y">y</span>
  </div>

  <div class="search-box">

    <!-- SEARCH ICON -->
    <button class="icon-button" onclick="focusSearch()" title="Search">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
    </button>

    <input
      id="searchInput"
      type="text"
      placeholder="Search the web..."
      onkeydown="handleEnter(event)"
    >

    <!-- MICROPHONE -->
    <button class="icon-button" onclick="voiceSearch()" title="Voice Search">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
      </svg>
    </button>

    <!-- LENS -->
    <button class="icon-button" onclick="lensSearch()" title="Lens">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M4 8V5a1 1 0 0 1 1-1h3"></path>
        <path d="M16 4h3a1 1 0 0 1 1 1v3"></path>
        <path d="M20 16v3a1 1 0 0 1-1 1h-3"></path>
        <path d="M8 20H5a1 1 0 0 1-1-1v-3"></path>
        <circle cx="12" cy="12" r="4"></circle>
      </svg>
    </button>

  </div>

  <button class="search-button" onclick="searchWeb()">
    Search
  </button>

</div>


<!-- =========================
     RESULTS PAGE
========================= -->

<div id="resultsPage">

  <div class="results-top">

    <div class="small-logo">
      <span class="o">O</span><span class="k">k</span><span class="a">a</span><span class="y">y</span>
    </div>

    <div class="result-search">

      <div class="search-box">

        <button class="icon-button" onclick="focusResultsInput()">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
        </button>

        <input
          id="resultsInput"
          type="text"
          placeholder="Search..."
          onkeydown="handleResultsEnter(event)"
        >

        <button class="icon-button" onclick="voiceSearch()">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </button>

        <button class="icon-button" onclick="lensSearch()">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 8V5a1 1 0 0 1 1-1h3"></path>
            <path d="M16 4h3a1 1 0 0 1 1 1v3"></path>
            <path d="M20 16v3a1 1 0 0 1-1 1h-3"></path>
            <path d="M8 20H5a1 1 0 0 1-1-1v-3"></path>
            <circle cx="12" cy="12" r="4"></circle>
          </svg>
        </button>

      </div>
    </div>
  </div>


  <!-- TABS -->

  <div class="tabs">

    <button onclick="searchNews('News')">News</button>

    <button onclick="searchNews('X')">X</button>

    <button onclick="searchNews('Instagram')">
      Instagram
    </button>

    <button onclick="searchNews('Threads')">
      Threads
    </button>

    <button onclick="searchNews('Trends')">
      Trends
    </button>

  </div>


  <div id="loading">
    Searching...
  </div>

  <div id="results"></div>

</div>


<script>

/* =====================================================
   CLOUDFLARE WORKER
===================================================== */

const API_URL =
"https://okay-search-api.satyamtiwaryokay.workers.dev";


/* =====================================================
   SEARCH WEB
===================================================== */

async function searchWeb() {

  let query =
    document.getElementById("searchInput").value.trim();

  if (query === "") {

    const resultsInput =
      document.getElementById("resultsInput");

    if (resultsInput) {
      query = resultsInput.value.trim();
    }
  }

  if (query === "") {

    alert("Please enter something to search.");

    return;
  }

  document.getElementById("homePage").style.display =
    "none";

  document.getElementById("resultsPage").style.display =
    "block";

  document.getElementById("resultsInput").value =
    query;

  const loading =
    document.getElementById("loading");

  const results =
    document.getElementById("results");

  loading.style.display = "block";

  results.innerHTML = "";


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        query: query
      })

    });


    const data = await response.json();

    loading.style.display = "none";


    if (data.error) {

      results.innerHTML =
        "<p>Search error: " +
        data.error +
        "</p>";

      return;
    }


    if (!data.results ||
        data.results.length === 0) {

      results.innerHTML =
        "<p>No results found.</p>";

      return;
    }


    data.results.forEach(function(item) {

      const card =
        document.createElement("div");

      card.className =
        "result-card";


      let imageHTML = "";

      if (item.image_url) {

        imageHTML =
          '<img class="result-image" src="' +
          item.image_url +
          '" onerror="this.style.display=\'none\'">';

      }


      card.innerHTML =

        '<a href="' +
        item.url +
        '" target="_blank" rel="noopener noreferrer">' +
        (item.title || "Untitled") +
        '</a>' +

        '<div class="result-url">' +
        (item.url || "") +
        '</div>' +

        '<p>' +
        (item.content || "") +
        '</p>' +

        imageHTML;


      results.appendChild(card);

    });


  } catch (error) {

    loading.style.display = "none";

    results.innerHTML =
      "<p>Unable to connect to Okay Search API.</p>";

    console.error(error);

  }
}


/* =====================================================
   ENTER KEY
===================================================== */

function handleEnter(event) {

  if (event.key === "Enter") {
    searchWeb();
  }

}


function handleResultsEnter(event) {

  if (event.key === "Enter") {
    searchWeb();
  }

}


/* =====================================================
   FOCUS
===================================================== */

function focusSearch() {

  document
    .getElementById("searchInput")
    .focus();

}


function focusResultsInput() {

  document
    .getElementById("resultsInput")
    .focus();

}


/* =====================================================
   VOICE SEARCH
===================================================== */

function voiceSearch() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "Voice search is not supported in this browser."
    );

    return;
  }


  const recognition =
    new SpeechRecognition();


  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0].transcript;


      const homeInput =
        document.getElementById("searchInput");

      const resultsInput =
        document.getElementById("resultsInput");


      if (
        document.getElementById("homePage")
          .style.display !== "none"
      ) {

        homeInput.value = text;

      } else {

        resultsInput.value = text;

      }


      searchWeb();

    };


  recognition.onerror =
    function(event) {

      console.log(
        "Voice error:",
        event.error
      );

    };


  recognition.start();

}


/* =====================================================
   LENS SEARCH
===================================================== */

function lensSearch() {

  alert(
    "Lens search will be connected in the next step."
  );

}


/* =====================================================
   NEWS / SOCIAL
===================================================== */

function searchNews(type) {

  let query = "";


  if (type === "News") {

    query = "latest news";

  }

  else if (type === "X") {

    query =
      "latest trending posts on X";

  }

  else if (type === "Instagram") {

    query =
      "latest trending posts on Instagram";

  }

  else if (type === "Threads") {

    query =
      "latest trending posts on Threads";

  }

  else if (type === "Trends") {

    query =
      "latest trending topics";

  }


  document.getElementById("resultsInput").value =
    query;


  searchWeb();

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode() {

  document.body.classList.toggle("dark");

}


/* =====================================================
   START
===================================================== */

document
  .getElementById("searchInput")
  .focus();

</script>

</body>
</html>
