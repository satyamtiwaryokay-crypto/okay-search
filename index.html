<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Okay</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        "Jakobe",
        "Inter",
        Arial,
        sans-serif;

    background: #ffffff;

    color: #202124;

    transition: 0.3s;
}


/* =========================
   TOP BAR
========================= */

.topbar {

    height: 70px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    padding: 0 25px;
}


.dark-btn {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #f1f3f4;

    cursor: pointer;

    font-size: 20px;
}


/* =========================
   MAIN
========================= */

.container {

    max-width: 1000px;

    margin: 65px auto 0;

    padding: 20px;
}


/* =========================
   OKAY LOGO
========================= */

.logo {

    text-align: center;

    font-size: 64px;

    font-weight: 700;

    letter-spacing: -4px;

    margin-bottom: 35px;
}

.logo-o {
    color: #ea4335;
}

.logo-k {
    color: #4285f4;
}

.logo-a {
    color: #fbbc05;
}

.logo-y {
    color: #34a853;
}


/* =========================
   SEARCH BOX
========================= */

.search-box {

    max-width: 750px;

    height: 60px;

    margin: auto;

    display: flex;

    align-items: center;

    border: 1px solid #dfe1e5;

    border-radius: 32px;

    padding: 0 8px 0 20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    transition: 0.2s;
}


.search-box:focus-within {

    box-shadow:
        0 3px 15px rgba(0,0,0,0.15);
}


/* SEARCH ICON */

.search-icon {

    display: flex;

    align-items: center;

    justify-content: center;

    color: #70757a;

    margin-right: 12px;
}


/* INPUT */

input {

    flex: 1;

    border: none;

    outline: none;

    font-size: 17px;

    background: transparent;

    color: #202124;

    min-width: 0;
}


/* =========================
   ICON BUTTONS
========================= */

.icon-btn {

    width: 42px;

    height: 42px;

    border: none;

    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    color: #5f6368;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}


.icon-btn:hover {

    background: #f1f3f4;

    color: #202124;
}


/* =========================
   SEARCH BUTTON
========================= */

.search-btn {

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: #111827;

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}


.search-btn:hover {

    transform: scale(1.05);
}


/* =========================
   LOADING
========================= */

#loading {

    text-align: center;

    margin: 25px;

    color: #777;
}


/* =========================
   RESULTS
========================= */

#results {

    max-width: 850px;

    margin: 45px auto;
}


.result {

    padding: 20px;

    margin-bottom: 15px;

    border: 1px solid #eeeeee;

    border-radius: 16px;

    transition: 0.2s;
}


.result:hover {

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

    transform: translateY(-2px);
}


.result a {

    color: #1558d6;

    font-size: 20px;

    font-weight: 600;

    text-decoration: none;
}


.result a:hover {

    text-decoration: underline;
}


.url {

    color: #188038;

    font-size: 13px;

    margin-top: 7px;

    word-break: break-all;
}


.description {

    color: #555;

    margin-top: 8px;

    line-height: 1.55;
}


/* =========================
   NEWS
========================= */

.news-section {

    max-width: 850px;

    margin: 55px auto 0;
}


.news-title {

    font-size: 24px;

    font-weight: 600;

    margin-bottom: 20px;
}


/* NEWS TABS */

.news-tabs {

    display: flex;

    gap: 10px;

    overflow-x: auto;

    margin-bottom: 20px;

    padding-bottom: 5px;
}


.news-tabs button {

    border: 1px solid #ddd;

    background: white;

    padding: 9px 17px;

    border-radius: 20px;

    cursor: pointer;

    white-space: nowrap;

    font-size: 14px;
}


.news-tabs button:hover {

    background: #f1f3f4;
}


/* NEWS CARD */

.news-card {

    display: flex;

    gap: 18px;

    padding: 18px 0;

    border-bottom: 1px solid #eeeeee;
}


.news-image {

    width: 150px;

    height: 95px;

    object-fit: cover;

    border-radius: 12px;

    background: #eeeeee;
}


.news-content {

    flex: 1;
}


.news-headline {

    font-size: 18px;

    font-weight: 600;

    color: #202124;

    text-decoration: none;

    line-height: 1.35;
}


.news-headline:hover {

    text-decoration: underline;
}


.news-source {

    font-size: 13px;

    color: #777;

    margin-top: 8px;
}


/* =========================
   DARK MODE
========================= */

body.dark {

    background: #111827;

    color: white;
}


body.dark .dark-btn {

    background: #374151;

    color: white;
}


body.dark .search-box {

    background: #1f2937;

    border-color: #4b5563;
}


body.dark input {

    color: white;
}


body.dark .search-icon,
body.dark .icon-btn {

    color: #cbd5e1;
}


body.dark .icon-btn:hover {

    background: #374151;
}


body.dark .news-tabs button {

    background: #1f2937;

    color: white;

    border-color: #4b5563;
}


body.dark .news-headline {

    color: white;
}


body.dark .news-card {

    border-color: #374151;
}


body.dark .result {

    background: #1f2937;

    border-color: #374151;
}


body.dark .description {

    color: #d1d5db;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .container {

        margin-top: 35px;

        padding: 15px;
    }


    .logo {

        font-size: 48px;

        margin-bottom: 28px;
    }


    .search-box {

        height: 56px;

        padding-left: 15px;
    }


    input {

        font-size: 15px;
    }


    .icon-btn {

        width: 35px;

        height: 35px;
    }


    .search-btn {

        width: 40px;

        height: 40px;
    }


    .news-card {

        gap: 12px;
    }


    .news-image {

        width: 105px;

        height: 75px;
    }


    .news-headline {

        font-size: 16px;
    }
}

</style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <button
        class="dark-btn"
        onclick="toggleDarkMode()">

        🌙

    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <span class="logo-o">O</span>
        <span class="logo-k">K</span>
        <span class="logo-a">A</span>
        <span class="logo-y">Y</span>

    </div>


    <!-- =========================
         SEARCH BOX
    ========================= -->

    <div class="search-box">


        <!-- SEARCH ICON -->

        <div class="search-icon">

            <svg
                width="21"
                height="21"
                viewBox="0 0 24 24"
                fill="none">

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                    stroke="currentColor"
                    stroke-width="2"/>

                <line
                    x1="16.5"
                    y1="16.5"
                    x2="21"
                    y2="21"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>

        </div>


        <!-- INPUT -->

        <input
            id="searchInput"
            type="text"
            placeholder="Search the web..."
            onkeydown="handleEnter(event)"
        >


        <!-- MICROPHONE -->

        <button
            class="icon-btn"
            onclick="voiceSearch()"
            aria-label="Voice search">

            <svg
                width="21"
                height="21"
                viewBox="0 0 24 24"
                fill="none">

                <rect
                    x="9"
                    y="3"
                    width="6"
                    height="11"
                    rx="3"
                    stroke="currentColor"
                    stroke-width="2"/>

                <path
                    d="M5 11a7 7 0 0 0 14 0"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <line
                    x1="12"
                    y1="18"
                    x2="12"
                    y2="21"
                    stroke="currentColor"
                    stroke-width="2"/>

                <line
                    x1="9"
                    y1="21"
                    x2="15"
                    y2="21"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>

        </button>


        <!-- LENS -->

        <button
            class="icon-btn"
            onclick="lensSearch()"
            aria-label="Lens search">

            <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none">

                <path
                    d="M4 8V6a2 2 0 0 1 2-2h2"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M16 4h2a2 2 0 0 1 2 2v2"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M20 16v2a2 2 0 0 1-2 2h-2"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M8 20H6a2 2 0 0 1-2-2v-2"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                    stroke="currentColor"
                    stroke-width="2"/>

            </svg>

        </button>


        <!-- SEARCH BUTTON -->

        <button
            class="search-btn"
            onclick="searchWeb()"
            aria-label="Search">

            <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none">

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                    stroke="white"
                    stroke-width="2"/>

                <line
                    x1="16.5"
                    y1="16.5"
                    x2="21"
                    y2="21"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>

        </button>


    </div>


    <!-- LOADING -->

    <div id="loading"></div>


    <!-- SEARCH RESULTS -->

    <div id="results"></div>


    <!-- =========================
         NEWS
    ========================= -->

    <div class="news-section">

        <div class="news-title">

            Latest News

        </div>


        <div class="news-tabs">

            <button
                onclick="searchNews('latest news')">

                News

            </button>


            <button
                onclick="searchNews('latest X Twitter posts')">

                X

            </button>


            <button
                onclick="searchNews('latest Instagram posts')">

                Instagram

            </button>


            <button
                onclick="searchNews('latest Threads posts')">

                Threads

            </button>


            <button
                onclick="searchNews('trending topics today')">

                Trends

            </button>

        </div>


        <div id="newsList">

            <div class="news-card">

                <div class="news-content">

                    <div class="news-headline">

                        Search the latest news with Okay

                    </div>

                    <div class="news-source">

                        Okay

                    </div>

                </div>

            </div>

        </div>

    </div>


</div>


<script>


/* =========================
   WEB SEARCH
========================= */

async function searchWeb() {


    const query =
        document
        .getElementById("searchInput")
        .value
        .trim();


    if (query === "") {

        alert(
            "Please enter something to search."
        );

        return;
    }


    const loading =
        document.getElementById("loading");


    const results =
        document.getElementById("results");


    loading.innerText =
        "Searching...";


    results.innerHTML = "";


    try {


        const response =
            await fetch(

                "https://okay-search-api.satyamtiwaryokay.workers.dev",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            query: query

                        })

                }

            );


        const data =
            await response.json();


        loading.innerText = "";


        if (data.error) {

            results.innerHTML =
                "<p>Search failed. Please try again.</p>";

            return;
        }


        if (
            !data.results ||
            data.results.length === 0
        ) {

            results.innerHTML =
                "<p>No results found.</p>";

            return;
        }


        data.results.forEach(
            function(item) {


                const resultDiv =
                    document.createElement(
                        "div"
                    );


                resultDiv.className =
                    "result";


                resultDiv.innerHTML = `

                    <a
                        href="${item.url}"
                        target="_blank">

                        ${item.title}

                    </a>


                    <div class="url">

                        ${item.url}

                    </div>


                    <div class="description">

                        ${item.content || ""}

                    </div>

                `;


                results.appendChild(
                    resultDiv
                );

            }
        );


    }

    catch(error) {


        loading.innerText = "";


        results.innerHTML =
            "<p>Unable to connect to search server.</p>";


        console.log(error);

    }

}


/* =========================
   ENTER SEARCH
========================= */

function handleEnter(event) {


    if (event.key === "Enter") {

        searchWeb();

    }

}


/* =========================
   VOICE SEARCH
========================= */

function voiceSearch() {


    if (
        !("webkitSpeechRecognition"
            in window)
    ) {

        alert(
            "Voice search is not supported in this browser."
        );

        return;
    }


    const recognition =
        new webkitSpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.start();


    recognition.onresult =
        function(event) {


            const text =
                event
                .results[0][0]
                .transcript;


            document
                .getElementById(
                    "searchInput"
                )
                .value = text;


            searchWeb();

        };

}


/* =========================
   LENS
========================= */

function lensSearch() {

    alert(
        "Lens search will be connected next."
    );

}


/* =========================
   NEWS
========================= */

function searchNews(type) {


    document
        .getElementById(
            "searchInput"
        )
        .value = type;


    searchWeb();

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {


    document.body
        .classList
        .toggle("dark");


    const button =
        document.querySelector(
            ".dark-btn"
        );


    if (
        document.body
        .classList
        .contains("dark")
    ) {

        button.innerText =
            "☀️";

    }

    else {

        button.innerText =
            "🌙";

    }

}


</script>
