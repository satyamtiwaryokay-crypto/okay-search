<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Okay Search</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #202124;
    transition: 0.3s;
}

/* Top bar */
.topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 18px 25px;
}

.dark-btn {
    border: none;
    background: #f1f3f4;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
}

/* Main */
.container {
    max-width: 900px;
    margin: 90px auto 0;
    padding: 20px;
    text-align: center;
}

/* Logo */
.logo {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 35px;
}

.logo span {
    font-weight: 400;
}

/* Search */
.search-box {
    display: flex;
    align-items: center;
    max-width: 720px;
    height: 58px;
    margin: auto;
    border: 1px solid #dfe1e5;
    border-radius: 30px;
    padding: 0 8px 0 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.search-box:focus-within {
    box-shadow: 0 3px 14px rgba(0,0,0,0.15);
}

.search-icon {
    font-size: 21px;
    color: #777;
    margin-right: 12px;
}

input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    background: transparent;
    color: inherit;
}

.search-btn {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: #111827;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.search-btn:hover {
    transform: scale(1.05);
}

/* Loading */
#loading {
    margin: 25px 0;
    color: #777;
}

/* Results */
#results {
    max-width: 850px;
    margin: 45px auto;
    text-align: left;
}

.result {
    padding: 20px;
    margin-bottom: 15px;
    border: 1px solid #eeeeee;
    border-radius: 16px;
    transition: 0.2s;
}

.result:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transform: translateY(-2px);
}

.result a {
    color: #1558d6;
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
}

.result a:hover {
    text-decoration: underline;
}

.url {
    color: #188038;
    font-size: 13px;
    margin-top: 7px;
    overflow: hidden;
}

.description {
    color: #555;
    margin-top: 9px;
    line-height: 1.55;
}

/* Dark mode */
body.dark {
    background: #111827;
    color: #f5f5f5;
}

body.dark .dark-btn {
    background: #374151;
    color: white;
}

body.dark .search-box {
    border-color: #4b5563;
    background: #1f2937;
}

body.dark input {
    color: white;
}

body.dark .search-icon {
    color: #aaa;
}

body.dark .result {
    background: #1f2937;
    border-color: #374151;
}

body.dark .description {
    color: #d1d5db;
}

body.dark #loading {
    color: #aaa;
}

/* Mobile */
@media (max-width: 600px) {

    .topbar {
        padding: 15px;
    }

    .container {
        margin-top: 55px;
        padding: 15px;
    }

    .logo {
        font-size: 43px;
        margin-bottom: 28px;
    }

    .search-box {
        height: 54px;
    }

    input {
        font-size: 16px;
    }

    .search-btn {
        width: 42px;
        height: 42px;
    }

    #results {
        margin-top: 30px;
    }

    .result {
        padding: 16px;
    }

    .result a {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <button class="dark-btn" onclick="toggleDarkMode()">🌙</button>
</div>

<div class="container">

    <div class="logo">
        Okay <span>Search</span>
    </div>

    <div class="search-box">

        <div class="search-icon">⌕</div>

        <input
            type="text"
            id="searchInput"
            placeholder="Search the web..."
            onkeydown="handleEnter(event)"
        >

        <button class="search-btn" onclick="searchWeb()">
            🔍
        </button>

    </div>

    <div id="loading"></div>

    <div id="results"></div>

</div>


<script>

async function searchWeb() {

    const query = document
        .getElementById("searchInput")
        .value
        .trim();

    if (query === "") {
        alert("Please enter something to search.");
        return;
    }

    const loading = document.getElementById("loading");
    const results = document.getElementById("results");

    loading.innerText = "🔎 Searching the web...";
    results.innerHTML = "";

    try {

        const response = await fetch(
            "https://okay-search-api.satyamtiwaryokay.workers.dev",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    query: query
                })
            }
        );

        const data = await response.json();

        loading.innerText = "";

        if (data.error) {
            results.innerHTML =
                "<p>Search failed. Please try again.</p>";
            return;
        }

        if (!data.results || data.results.length === 0) {
            results.innerHTML =
                "<p>No results found.</p>";
            return;
        }

        data.results.forEach(function(item) {

            const resultDiv =
                document.createElement("div");

            resultDiv.className = "result";

            resultDiv.innerHTML = `
                <a href="${item.url}" target="_blank">
                    ${item.title}
                </a>

                <div class="url">
                    ${item.url}
                </div>

                <div class="description">
                    ${item.content || ""}
                </div>
            `;

            results.appendChild(resultDiv);

        });

    } catch (error) {

        loading.innerText = "";

        results.innerHTML =
            "<p>Unable to connect to search server.</p>";

        console.error(error);
    }
}


function handleEnter(event) {

    if (event.key === "Enter") {
        searchWeb();
    }

}


function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const button =
        document.querySelector(".dark-btn");

    if (document.body.classList.contains("dark")) {
        button.innerText = "☀️";
    } else {
        button.innerText = "🌙";
    }

}

</script>

</body>
</html>
