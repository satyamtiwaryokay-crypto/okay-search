<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Okay Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        .container {
            text-align: center;
            margin-top: 100px;
            padding: 20px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 35px;
        }

        .search-box {
            max-width: 700px;
            margin: auto;
            display: flex;
            border: 1px solid #ccc;
            border-radius: 30px;
            overflow: hidden;
        }

        input {
            flex: 1;
            padding: 18px 20px;
            border: none;
            outline: none;
            font-size: 18px;
        }

        button {
            width: 70px;
            border: none;
            background: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background: #f2f2f2;
        }

        #results {
            max-width: 850px;
            margin: 40px auto;
            text-align: left;
        }

        .result {
            margin-bottom: 28px;
        }

        .result a {
            color: #1a0dab;
            font-size: 21px;
            text-decoration: none;
        }

        .result a:hover {
            text-decoration: underline;
        }

        .url {
            color: #188038;
            font-size: 14px;
            margin-top: 5px;
        }

        .description {
            color: #444;
            margin-top: 7px;
            line-height: 1.5;
        }

        #loading {
            margin-top: 25px;
            color: #777;
        }

        @media (max-width: 600px) {

            .container {
                margin-top: 70px;
            }

            h1 {
                font-size: 42px;
            }

            input {
                font-size: 16px;
            }

            #results {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Okay Search</h1>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search the web..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="searchWeb()">🔍</button>

        </div>

        <div id="loading"></div>

        <div id="results"></div>

    </div>


    <script>

        async function searchWeb() {

            const query = document
                .getElementById("searchInput")
                .value
                .trim();

            if (query === "") {
                alert("Please enter something to search.");
                return;
            }

            const loading = document.getElementById("loading");
            const results = document.getElementById("results");

            loading.innerText = "Searching...";
            results.innerHTML = "";

            try {

                const response = await fetch(
                    "https://okay-search-api.satyamtiwaryokay.workers.dev",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            query: query
                        })
                    }
                );

                const data = await response.json();

                loading.innerText = "";

                if (data.error) {
                    results.innerHTML =
                        "<p>Search failed. Please try again.</p>";
                    return;
                }

                if (!data.results || data.results.length === 0) {
                    results.innerHTML =
                        "<p>No results found.</p>";
                    return;
                }

                data.results.forEach(function(item) {

                    const resultDiv =
                        document.createElement("div");

                    resultDiv.className = "result";

                    resultDiv.innerHTML = `
                        <a href="${item.url}" target="_blank">
                            ${item.title}
                        </a>

                        <div class="url">
                            ${item.url}
                        </div>

                        <div class="description">
                            ${item.content || ""}
                        </div>
                    `;

                    results.appendChild(resultDiv);

                });

            } catch (error) {

                loading.innerText = "";

                results.innerHTML =
                    "<p>Unable to connect to search server.</p>";

                console.error(error);
            }
        }


        function handleEnter(event) {

            if (event.key === "Enter") {
                searchWeb();
            }

        }

    </script>

</body>
</html>
