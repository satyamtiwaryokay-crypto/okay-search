<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Okay</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Jakobe", "Inter", Arial, sans-serif;
    background: #fff;
    color: #202124;
    transition: 0.3s;
}

/* TOP BAR */

.topbar {
    height: 70px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 25px;
}

.dark-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #f1f3f4;
    cursor: pointer;
    font-size: 20px;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: 65px auto 0;
    padding: 20px;
}

/* LOGO */

.logo {
    text-align: center;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -4px;
    margin-bottom: 35px;
}

.o {
    color: #ea4335;
}

.k {
    color: #4285f4;
}

.a {
    color: #fbbc05;
}

.y {
    color: #34a853;
}

/* SEARCH BOX */

.search-box {
    max-width: 750px;
    height: 60px;
    margin: auto;

    display: flex;
    align-items: center;

    border: 1px solid #dfe1e5;
    border-radius: 32px;

    padding: 0 8px 0 20px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

    transition: 0.2s;
}

.search-box:focus-within {
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

.search-icon {
    font-size: 23px;
    color: #777;
    margin-right: 12px;
}

input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    background: transparent;
    color: #202124;
}

/* MIC + LENS */

.icon-btn {
    width: 42px;
    height: 42px;

    border: none;
    background: transparent;

    border-radius: 50%;
    cursor: pointer;

    font-size: 21px;
}

.icon-btn:hover {
    background: #f1f3f4;
}

/* SEARCH BUTTON */

.search-btn {
    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: #111827;
    color: white;

    font-size: 19px;

    cursor: pointer;
}

.search-btn:hover {
    transform: scale(1.05);
}

/* NEWS */

.news-section {
    max-width: 850px;
    margin: 55px auto 0;
}

.news-title {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 20px;
}

.news-tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 20px;
}

.news-tabs button {
    border: 1px solid #ddd;
    background: white;

    padding: 9px 17px;
    border-radius: 20px;

    cursor: pointer;
    white-space: nowrap;
}

.news-tabs button:hover {
    background: #f1f3f4;
}

/* NEWS CARD */

.news-card {
    display: flex;
    gap: 18px;

    padding: 18px 0;

    border-bottom: 1px solid #eee;
}

.news-image {
    width: 150px;
    height: 95px;

    object-fit: cover;

    border-radius: 12px;
    background: #eee;
}

.news-content {
    flex: 1;
}

.news-headline {
    font-size: 18px;
    font-weight: 600;

    color: #202124;
    text-decoration: none;
}

.news-headline:hover {
    text-decoration: underline;
}

.news-source {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
}

/* RESULTS */

#loading {
    text-align: center;
    margin: 25px;
    color: #777;
}

#results {
    max-width: 850px;
    margin: 45px auto;
}

.result {
    padding: 20px;

    margin-bottom: 15px;

    border: 1px solid #eee;
    border-radius: 16px;

    transition: 0.2s;
}

.result:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transform: translateY(-2px);
}

.result a {
    color: #1558d6;
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
}

.url {
    color: #188038;
    font-size: 13px;
    margin-top: 7px;
}

.description {
    color: #555;
    margin-top: 8px;
    line-height: 1.55;
}

/* DARK MODE */

body.dark {
    background: #111827;
    color: white;
}

body.dark .dark-btn {
    background: #374151;
    color: white;
}

body.dark .search-box {
    background: #1f2937;
    border-color: #4b5563;
}

body.dark input {
    color: white;
}

body.dark .news-tabs button {
    background: #1f2937;
    color: white;
    border-color: #4b5563;
}

body.dark .news-headline {
    color: white;
}

body.dark .news-card {
    border-color: #374151;
}

body.dark .result {
    background: #1f2937;
    border-color: #374151;
}

body.dark .description {
    color: #d1d5db;
}

/* MOBILE */

@media(max-width:600px) {

    .container {
        margin-top: 35px;
        padding: 15px;
    }

    .logo {
        font-size: 48px;
        margin-bottom: 28px;
    }

    .search-box {
        height: 56px;
        padding-left: 15px;
    }

    input {
        font-size: 15px;
    }

    .icon-btn {
        width: 35px;
        font-size: 18px;
    }

    .search-btn {
        width: 40px;
        height: 40px;
    }

    .news-card {
        gap: 12px;
    }

    .news-image {
        width: 105px;
        height: 75px;
    }

    .news-headline {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <button class="dark-btn" onclick="toggleDarkMode()">
        🌙
    </button>

</div>


<div class="container">

    <!-- LOGO -->

    <div class="logo">
        <span class="o">O</span><span class="k">K</span><span class="a">A</span><span class="y">Y</span>
    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <div class="search-icon">
            ⌕
        </div>

        <input
            id="searchInput"
            type="text"
            placeholder="Search the web..."
            onkeydown="handleEnter(event)"
        >

        <button class="icon-btn" onclick="voiceSearch()">
            🎤
        </button>

        <button class="icon-btn" onclick="lensSearch()">
            📷
        </button>

        <button class="search-btn" onclick="searchWeb()">
            🔍
        </button>

    </div>


    <div id="loading"></div>


    <div id="results"></div>


    <!-- NEWS -->

    <div class="news-section">

        <div class="news-title">
            Latest News
        </div>


        <div class="news-tabs">

            <button onclick="searchNews('News')">
                News
            </button>

            <button onclick="searchNews('X')">
                X
            </button>

            <button onclick="searchNews('Instagram')">
                Instagram
            </button>

            <button onclick="searchNews('Trending')">
                Trending
            </button>

        </div>


        <div id="newsList">

            <div class="news-card">

                <img
                    class="news-image"
                    src="https://images.unsplash.com/photo-1504711434969-e33886168f5c"
                >

                <div class="news-content">

                    <a class="news-headline" href="#">
                        Search the latest news with Okay
                    </a>

                    <div class="news-source">
                        Okay News
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* SEARCH */

async function searchWeb() {

    const query =
        document.getElementById("searchInput")
        .value.trim();

    if (query === "") {
        alert("Please enter something to search.");
        return;
    }

    const loading =
        document.getElementById("loading");

    const results =
        document.getElementById("results");

    loading.innerText =
        "🔎 Searching...";

    results.innerHTML = "";

    try {

        const response =
            await fetch(
                "https://okay-search-api.satyamtiwaryokay.workers.dev",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        query: query
                    })
                }
            );

        const data =
            await response.json();

        loading.innerText = "";

        if (data.error) {

            results.innerHTML =
                "<p>Search failed.</p>";

            return;
        }

        if (!data.results ||
            data.results.length === 0) {

            results.innerHTML =
                "<p>No results found.</p>";

            return;
        }

        data.results.forEach(function(item) {

            const resultDiv =
                document.createElement("div");

            resultDiv.className =
                "result";

            resultDiv.innerHTML = `

                <a href="${item.url}" target="_blank">
                    ${item.title}
                </a>

                <div class="url">
                    ${item.url}
                </div>

                <div class="description">
                    ${item.content || ""}
                </div>

            `;

            results.appendChild(resultDiv);

        });

    }

    catch(error) {

        loading.innerText = "";

        results.innerHTML =
            "<p>Unable to connect to search server.</p>";

        console.log(error);

    }
}


/* ENTER */

function handleEnter(event) {

    if (event.key === "Enter") {
        searchWeb();
    }

}


/* DARK MODE */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const button =
        document.querySelector(".dark-btn");

    if (document.body.classList.contains("dark")) {

        button.innerText = "☀️";

    } else {

        button.innerText = "🌙";

    }

}


/* VOICE */

function voiceSearch() {

    if (!("webkitSpeechRecognition" in window)) {

        alert("Voice search is not supported in this browser.");

        return;
    }

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "en-IN";

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        document.getElementById("searchInput")
            .value = text;

        searchWeb();
    };
}


/* LENS STYLE BUTTON */

function lensSearch() {

    alert(
        "Lens search will be connected in the next step."
    );

}


/* NEWS SEARCH */

function searchNews(type) {

    const input =
        document.getElementById("searchInput");

    input.value =
        type + " latest news";

    searchWeb();

}

</script>

</body>
</html>
